name: Build Main
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Read SDK revision
        id: sdk
        run: echo "revision=$(cat .github/sdk-revision)" >> "$GITHUB_OUTPUT"
      - name: Check out SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wanaku-ai/wanaku-capabilities-java-sdk
          ref: ${{ steps.sdk.outputs.revision }}
          path: target/sdk
          persist-credentials: false
      - name: Install SDK
        run: mvn -B -ntp -f target/sdk/pom.xml install -DskipTests
      - name: Check committed formatting
        run: mvn -B -ntp spotless:check
      - name: Check manifest assembly
        run: ./scripts/test-build-manifests.sh
      - name: Build with Maven
        run: mvn -B -ntp clean verify
      - name: Upload packaged runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wanaku-semantic-router-${{ matrix.os }}
          path: |
            target/wanaku-semantic-router-*.jar
            target/lib/
      - name: Set arch
        id: arch
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
      - name: Build container
        env:
          IMAGE_TAG: ${{ github.ref_name }}-${{ steps.arch.outputs.arch }}
        run: podman build -t "quay.io/wanaku/wanaku-semantic-router:$IMAGE_TAG" .
      - name: Check runtime container
        env:
          IMAGE_TAG: ${{ github.ref_name }}-${{ steps.arch.outputs.arch }}
        run: ./scripts/container-smoke.sh "quay.io/wanaku/wanaku-semantic-router:$IMAGE_TAG"
      - name: Login to Container Registry
        if: github.repository == 'wanaku-ai/wanaku-semantic-router' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Push container
        if: github.repository == 'wanaku-ai/wanaku-semantic-router' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_TAG: ${{ github.ref_name }}-${{ steps.arch.outputs.arch }}
        run: podman push "quay.io/wanaku/wanaku-semantic-router:$IMAGE_TAG"

  createManifests:
    needs: build
    if: github.repository == 'wanaku-ai/wanaku-semantic-router' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Login to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build and Push Manifests
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: ./build-manifests.sh "$IMAGE_TAG"
