name: release-artifacts
on:
  workflow_dispatch:
    inputs:
      currentDevelopmentVersion:
        description: The release version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-artifacts-${{ inputs.currentDevelopmentVersion }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.currentDevelopmentVersion }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || exit 1
          [[ "$RELEASE_VERSION" != *-SNAPSHOT ]] || exit 1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: wanaku-semantic-router-${{ inputs.currentDevelopmentVersion }}
      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Read SDK revision
        id: sdk
        run: echo "revision=$(cat .github/sdk-revision)" >> "$GITHUB_OUTPUT"
      - name: Check out SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wanaku-ai/wanaku-capabilities-java-sdk
          ref: ${{ steps.sdk.outputs.revision }}
          path: target/sdk
          persist-credentials: false
      - name: Install SDK
        run: mvn -B -ntp -f target/sdk/pom.xml install -DskipTests
      - name: Check committed formatting
        run: mvn -B -ntp spotless:check
      - name: Check manifest assembly
        run: ./scripts/test-build-manifests.sh
      - name: Build with Maven
        run: mvn -B -ntp clean verify
      - name: Check artifact version
        env:
          RELEASE_VERSION: ${{ inputs.currentDevelopmentVersion }}
        run: test -f "target/wanaku-semantic-router-$RELEASE_VERSION.jar"
      - name: Set arch
        id: arch
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
      - name: Build container
        env:
          IMAGE_TAG: ${{ inputs.currentDevelopmentVersion }}-${{ steps.arch.outputs.arch }}
        run: podman build -t "quay.io/wanaku/wanaku-semantic-router:$IMAGE_TAG" .
      - name: Check runtime container
        env:
          IMAGE_TAG: ${{ inputs.currentDevelopmentVersion }}-${{ steps.arch.outputs.arch }}
        run: ./scripts/container-smoke.sh "quay.io/wanaku/wanaku-semantic-router:$IMAGE_TAG"
      - name: Login to Container Registry
        if: github.repository == 'wanaku-ai/wanaku-semantic-router'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Push container
        if: github.repository == 'wanaku-ai/wanaku-semantic-router'
        env:
          IMAGE_TAG: ${{ inputs.currentDevelopmentVersion }}-${{ steps.arch.outputs.arch }}
        run: podman push "quay.io/wanaku/wanaku-semantic-router:$IMAGE_TAG"

  createManifests:
    needs: build
    if: github.repository == 'wanaku-ai/wanaku-semantic-router'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: wanaku-semantic-router-${{ inputs.currentDevelopmentVersion }}
      - name: Login to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build and Push Manifests
        env:
          IMAGE_TAG: ${{ inputs.currentDevelopmentVersion }}
        run: ./build-manifests.sh "$IMAGE_TAG"
