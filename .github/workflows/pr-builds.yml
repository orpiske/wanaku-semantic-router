name: Multiplatform PR Builds
on:
  pull_request:
    branches:
      - main
      - '[0-9]*.[0-9]*.x'
permissions:
  contents: read
jobs:
  build:
    continue-on-error: ${{ matrix.experimental }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        experimental: [false]
        include:
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Read SDK revision
        id: sdk
        run: echo "revision=$(cat .github/sdk-revision)" >> "$GITHUB_OUTPUT"
      - name: Check out SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wanaku-ai/wanaku-capabilities-java-sdk
          ref: ${{ steps.sdk.outputs.revision }}
          path: target/sdk
          persist-credentials: false
      - name: Install SDK
        run: mvn -B -ntp -f target/sdk/pom.xml install -DskipTests
      - name: Check committed formatting
        run: mvn -B -ntp spotless:check
      - name: Check manifest assembly
        if: runner.os == 'Linux'
        run: ./scripts/test-build-manifests.sh
      - name: Build with Maven
        run: mvn -B -ntp clean verify
      - name: Generate Test Reports
        if: always()
        run: mvn -B -ntp surefire-report:report-only surefire-report:failsafe-report-only -Daggregate=true
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: target/reports/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14
          if-no-files-found: ignore
      - name: Build container
        if: runner.os == 'Linux'
        run: podman build -t wanaku-semantic-router:local .
      - name: Check runtime container
        if: runner.os == 'Linux'
        run: ./scripts/container-smoke.sh wanaku-semantic-router:local
